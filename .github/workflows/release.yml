# builds pgfmt on every platform it ships to, after running the tests there.
# a v* tag also publishes a github release with the archives and checksums.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            targets: darwin-arm64 darwin-amd64
          - runner: ubuntu-24.04
            targets: linux-amd64
          - runner: ubuntu-24.04-arm
            targets: linux-arm64
          - runner: windows-latest
            targets: windows-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build
        run: scripts/build.sh "${GITHUB_REF_NAME}" ${{ matrix.targets }}
      - uses: actions/upload-artifact@v7
        with:
          name: pgfmt-${{ matrix.runner }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes

  homebrew:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sirmspencer/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-formula.sh "${GITHUB_REF_NAME}" tap/pgfmt.rb
      - name: commit
        id: commit
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgfmt.rb
          if git diff --cached --quiet; then
            echo "the formula is unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "pgfmt ${GITHUB_REF_NAME#v}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # install from the committed checkout, so a formula that fails is never pushed
      - name: install and test
        if: steps.commit.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap sirmspencer/tap "$PWD/tap"
          brew trust sirmspencer/tap || true
          brew install sirmspencer/tap/pgfmt
          brew test sirmspencer/tap/pgfmt
          pgfmt -version
      - name: push
        if: steps.commit.outputs.changed == 'true'
        working-directory: tap
        run: git push

  npm:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: package
        run: scripts/package-npm.sh "${GITHUB_REF_NAME}" dist
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # platform packages first, so the main package never points at a missing
          # version; versions already published, as in a rerun, are skipped
          for dir in dist/npm/pgfmt-* dist/npm/pgfmt; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$dir" --access public --provenance
          done

  vscode:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install
        run: npm ci --prefix editors/vscode
      - name: package
        run: scripts/package-vscode.sh "${GITHUB_REF_NAME}" dist
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.vsix --repo "${GITHUB_REPOSITORY}" --clobber
      - name: publish to the vs code marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for vsix in "$PWD"/dist/*.vsix; do
            (cd editors/vscode && npx vsce publish --packagePath "$vsix")
          done
      - name: publish to open vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx --yes ovsx create-namespace sirmspencer -p "$OVSX_PAT" || true
          for vsix in dist/*.vsix; do
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          done

  jetbrains:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: package
        run: scripts/package-intellij.sh "${GITHUB_REF_NAME}" dist
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/pgfmt-intellij-*.zip --repo "${GITHUB_REPOSITORY}" --clobber
      # the first version of a plugin must be uploaded by hand on plugins.jetbrains.com;
      # set the repository variable JETBRAINS_PUBLISH to true once it is approved
      - name: publish to the jetbrains marketplace
        if: vars.JETBRAINS_PUBLISH == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        working-directory: editors/intellij
        run: ./gradlew publishPlugin -PpluginVersion="${GITHUB_REF_NAME#v}" --console=plain
